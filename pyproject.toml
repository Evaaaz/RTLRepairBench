[project]
name = "lint-vs-semantic-standalone-release"
version = "0.1.0"
description = "Release and reproducibility tooling for the lint-vs-semantic RTL study"
requires-python = ">=3.9"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["tools"]
